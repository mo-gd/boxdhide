<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dark canvas from the first frame, before the stylesheet loads. -->
  <meta name="color-scheme" content="dark">
  <title>BoxdHide</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../settings.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="header">
    <img src="../../icons/logo.svg" alt="" width="22" height="22">
    <h1>BoxdHide</h1>
    <span class="flag-fr" role="img" aria-label="France"></span>
    <span class="switch">
      <input type="checkbox" role="switch" data-key="enabled" aria-label="Enable BoxdHide">
      <span class="track"></span>
    </span>
  </header>

  <fieldset id="settings">
    <section>
      <h2>Hide until watched</h2>
      <div id="features"></div>
    </section>
    <section>
      <h2>Options</h2>
      <div id="options"></div>
    </section>
  </fieldset>

  <footer class="footer">
    <a href="https://mo-gd.github.io/boxdhide/" target="_blank" rel="noopener">Website</a>
    <button type="button" id="reset">Reset</button>
    <span class="discord"><span class="flag-fr" role="img" aria-label="France"></span> My Discord = Impositoire</span>
  </footer>

  <template id="row-template">
    <label class="row">
      <span></span>
      <span class="switch">
        <input type="checkbox" role="switch">
        <span class="track"></span>
      </span>
    </label>
  </template>
</body>
</html>
